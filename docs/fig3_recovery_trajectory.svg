  <polyline fill="none" stroke="#be123c" stroke-width="3" stroke-dasharray="4,4" points="90.0,198.2 216.1,225.2 347.4,248.8 478.7,278.4 610.0,290.0"/>
  <polyline fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="8,5" points="90.0,82.0 216.1,88.6 347.4,94.6 478.7,120.4 610.0,143.4"/>
  <polyline fill="none" stroke="#0284c7" stroke-width="3.5" points="90.0,50.0 216.1,50.0 347.4,50.0 478.7,65.3 610.0,78.7"/>

  <circle cx="90.0" cy="198.2" r="4" fill="#be123c"/>
  <circle cx="216.1" cy="225.2" r="4" fill="#be123c"/>
  <circle cx="347.4" cy="248.8" r="4" fill="#be123c"/>
  <circle cx="478.7" cy="278.4" r="4" fill="#be123c"/>
  <circle cx="610.0" cy="290.0" r="4" fill="#be123c"/>
