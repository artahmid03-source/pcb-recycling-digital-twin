  <circle cx="216.1" cy="88.6" r="4" fill="#d97706"/>
  <circle cx="347.4" cy="94.6" r="4" fill="#d97706"/>
  <circle cx="478.7" cy="120.4" r="4" fill="#d97706"/>
  <circle cx="610.0" cy="143.4" r="4" fill="#d97706"/>
